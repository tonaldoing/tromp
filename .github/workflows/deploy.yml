# Deploy automático a Firebase Hosting en cada push a main.
# Requiere el secret FIREBASE_SERVICE_ACCOUNT (JSON de una service account
# con el rol "Firebase Hosting Admin" del proyecto trompocostos-app).
name: Deploy a Firebase Hosting

on:
  push:
    branches: [main]
  # Permite dispararlo a mano desde la pestaña Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Corre type-check + vite build (script "build" del package.json)
      - name: Build de producción
        run: npm run build

      # Las reglas de Firestore viven en firestore.rules y solo llegan a
      # producción con este paso: la action de hosting no las despliega
      - name: Deploy reglas de Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@14 deploy --only firestore:rules --project trompocostos-app --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: trompocostos-app
